# ByteTrack configuration
# Uses low-confidence detections to rescue tracks during occlusions

tracker_node:
  ros__parameters:
    tracker_type: "bytetrack"
    
    # Common parameters
    min_score: 0.2
    # ByteTrack-specific parameters
    track_thresh: 0.5
    match_thresh: 0.8
    track_buffer: 30
    det_thresh: 0.2
    second_match_thresh: 0.5
    new_track_thresh: 0.6
    unconfirmed_match_thresh: 0.7
