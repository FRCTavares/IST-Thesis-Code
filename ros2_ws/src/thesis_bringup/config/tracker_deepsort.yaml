# DeepSORT configuration
# Uses an 8D Kalman state, Mahalanobis gating, matching cascade,
# cosine-gallery association with the MARS ReID CNN, and IoU fallback.

tracker_node:
  ros__parameters:
    tracker_type: "deepsort"

    # Common filtering
    min_score: 0.35

    # DeepSORT lifecycle and association
    max_age: 30
    n_init: 3
    max_iou_distance: 0.75
    max_cosine_distance: 0.2
    nn_budget: 100
    only_position_gating: false

    # Appearance input and extraction
    image_topic: "/camera/image_raw"
    reid_batch_size: 32
