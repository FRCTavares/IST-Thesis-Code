# OC-SORT configuration
# Observation-centric motion association without an appearance descriptor.

tracker_node:
  ros__parameters:
    tracker_type: "ocsort"

    # Common filtering
    min_score: 0.35

    # OC-SORT association and lifecycle
    iou_threshold: 0.18
    max_age: 4
    min_hits: 3
    det_thresh: 0.35
    delta_t: 3
    inertia: 0.2
    use_byte: false
