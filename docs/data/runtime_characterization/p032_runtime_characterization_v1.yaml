# This manifest is intentionally self-contained on `main`. It does not read
# or depend on any file that lives only on the parked `issue-58-*` branch.
# Architecture IDs match Issue #58's naming exactly so results can be joined
# later without re-deriving identifiers.

frozen_boundary:
