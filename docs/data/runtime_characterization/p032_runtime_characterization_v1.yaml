measurement_modes:
  replay_algorithmic_cost:
    schema: p032_replay_cost_v1
    description: >
      Deterministic, non-real-time batch replay of the tracker (and TIM,
      where enabled) backend against the frozen source bag's existing
      /detections stream. No ROS executor scheduling or playback pacing is
      involved. Valid for: reproducibility, algorithm CPU-service-time,
      peak memory, and fair architecture-to-architecture comparison under
      identical input. NOT valid for: real-time latency, cadence, jitter,
      backlog, or any live wall-clock claim.
    executed_via: tools/experiments/measure_p032_replay_cost.py
    reuses:
      - thesis_tracker.backends.* (unmodified tracker backend classes)
      - tools/experiments/run_deterministic_tim_replay.py (TIM stage, subprocess)
      - tools/timing_contract.py
    known_limitation: >
      tools/experiments/run_deterministic_tim_replay.py hardcodes
      lat_ms=0.0 and appearance_backend_wall_ms=0.0 (verified by source
      inspection) because it performs no real-time wall-clock measurement.
      tools/analysis/analyse_p032_appearance_budget.py therefore reports
      TIM core / MARS extraction latency percentiles as null (not zero) for
      this measurement mode. Only the live_sustained mode below carries
      genuine per-frame TIM/MARS latency percentiles.

  live_sustained:
    schema: p032_live_sustained_v1
    description: >
      Real ROS 2 nodes (perception detector, tracker, TIM) executing live on
      the target hardware for a bounded sustained duration. Source imagery
      is supplied through the established Issue #44 timestamp-refresh replay
      relay (tools/experiments/p044_soak_input_relay.py), which republishes
      recorded frames and tracks onto the live topics the real nodes consume
      at realistic cadence -- this is not a physically live camera capture,
      and is not offline batch replay. Valid for: true end-to-end wall-clock
      latency distributions, real cadence/jitter, queue/backlog, detector/
      Hailo contention, sustained thermal/frequency behaviour, sustained
      CPU/memory behaviour. Warm-up window is excluded from steady-state
      statistics.
    executed_via: tools/experiments/run_p032_sustained_ground_run.sh
    reuses:
      - tools/experiments/p044_soak_input_relay.py
      - tools/analysis/collect_live_timing_stats.py
      - tools/analysis/check_live_timing_invariants.py
      - tools/experiments/sample_process_groups.py
      - tools/experiments/sample_p044_hardware_health.py
      - tools/analysis/analyse_tim_reid_workload.py
    warm_up_s: 60.0
    minimum_sustained_duration_s: 900.0
    sampling_cadence_s:
      process_groups: 1.0
      hardware_health: 5.0

power:
  status: unavailable_no_calibrated_sensor
  reason: >
    No INA219/INA226-class calibrated power sensor is installed on this
    hardware. Software-estimated power from CPU/clock state is explicitly
    rejected by the issue's own instruction (mark unavailable rather than
    estimate). Revisit only if calibrated hardware is added.

issue_58_join:
  join_keys: [architecture_id, sequence_id]
  architecture_id_values:
    - bytetrack_raw
    - bytetrack_tim
    - sort_raw
    - sort_tim
    - deepsort_raw
    - deepsort_tim
  sequence_id_values:
    - dev_may_hard_reentry
    - dev_june_seq01
    - dev_june_seq03
    - dev_june_seq04
  contract: >
    #58 owns safety/availability/recovery outcome rows keyed by the same
    (architecture_id, sequence_id) pair. #32 outputs are joinable by that
    pair without rerunning or manually re-interpreting either issue's logs.
    #32 does not read, modify, or depend on the issue-58-* branch; the join
    is a schema contract, not a file dependency.
