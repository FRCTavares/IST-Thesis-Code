tim_mars_config:
  path: ros2_ws/src/thesis_bringup/config/tim_mars_canonical.yaml
  sha256: 0f2ac3fc780781c3921430310abfddeac2bfeb6c1c833529f2f1054d263f15c0
  model: models/reid/mars-small128.pb
  note: >-
    This is the post-Issue-#90 promoted canonical TIM-MARS configuration and
    matches the Issue #27 frozen canonical_config sha256. It is passed
    unchanged to run_deterministic_tim_replay.py for every cell.

pipeline:
  stages:
    - id: tracker_replay
      tool: tools/experiments/run_deterministic_tracker_replay.py
      note: >-
        Regenerates /tracks and a fixed-ID raw /target deterministically from
        the frozen recorded images and detections using the candidate ByteTrack
        YAML. selection-mode is largest_first_eligible only to produce a
        complete /tracks stream; the operator bootstrap target is resolved
        separately and spatially (see bootstrap_resolution).
    - id: bootstrap_resolution
      tool: tools/analysis/resolve_bootstrap_target.py
      rule: >-
        At the first generated /tracks message whose best-overlapping track
        reaches the IoU threshold against the physical-target reference box at
        the first present_scored reference sample, select that track ID. The
        same rule is applied identically to every cell. IoU threshold 0.5. If
        no track reaches the threshold within max_bootstrap_lag_frames the cell
        is recorded as a bootstrap failure and preserved, not dropped and not
        silently re-anchored.
      min_iou: 0.5
      max_bootstrap_lag_frames: 30
    - id: tim_replay
      tool: tools/experiments/run_deterministic_tim_replay.py
      args_note: >-
        --config tim_mars_canonical.yaml --model models/reid/mars-small128.pb
        --selected-track-id <resolved> --raw-target-mode selected_id
        --raw-target-topic /target --image-topic /camera/image_raw
        --tracks-topic /tracks --image-width <seq> --image-height <seq>
        --compact-output
    - id: physical_v2_evaluation
      tool: tools/analysis/evaluate_physical_target_bbox_v2.py
      note: >-
        Evaluates both the raw fixed-ID /target stream and the
        /target_memory_mars TIM stream against the identity-independent
        physical-v2 reference in one pass.
    - id: raw_tracker_diagnostics
      tool: tools/analysis/analyse_tracker_target_continuity.py
      note: >-
        Identity-independent raw ByteTrack diagnostics derived from the
        generated /tracks stream and the physical-v2 reference: matched
        target track IDs over time, target ID switches, fragmentation,
        target-visible coverage, false continuation during physical absence,
        disappearance delay.
    - id: tim_state_occupancy
      tool: tools/analysis/analyse_tim_state_occupancy.py
      note: >-
        TIM-MARS state occupancy and transition counts parsed from
        /target_memory_mars/status. Only states present in the canonical
        status schema are reported.

evaluation:
  reference_dir: docs/data/physical_target_references
  evaluator: physical_target_bbox_evaluation_v2
  identity_model: identity_independent_spatial
  disallowed_evaluators:
    - tools/analysis/evaluate_tim_event_recovery.py
    - tools/analysis/evaluate_tim_target_bbox_correctness.py
  disallowed_reason: >-
    Those evaluators depend on tracker-ID annotation oracles. ByteTrack IDs
    change across configurations, so a tracker-ID oracle is not a valid
    cross-configuration headline evaluator here.

