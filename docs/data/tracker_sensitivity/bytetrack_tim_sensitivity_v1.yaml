dimensions:
  - id: track_thresh
    label: Detection score split threshold (high vs low association round)
    kind: single
    parameters: [track_thresh]
    canonical_values:
      track_thresh: 0.50
    pinned_alongside:
      new_track_thresh: 0.6
    note: >-
      track_thresh partitions detections into the high-score first-association
      round and the low-score second-association round. new_track_thresh is
      held at its canonical 0.6 so this dimension isolates the association
      split from track birth. Symmetric single step of 0.10.
    perturbations:
      - id: track_thresh_lower_1
        values: {track_thresh: 0.40}
      - id: track_thresh_higher_1
        values: {track_thresh: 0.60}

  - id: match_thresh
    label: First-round IoU association acceptance threshold
    kind: single
    parameters: [match_thresh]
    canonical_values:
      match_thresh: 0.80
    note: >-
      match_thresh is the maximum fused IoU distance accepted in the first
      high-score association round. Lower is stricter association; higher is
      more permissive. Symmetric single step of 0.10.
    perturbations:
      - id: match_thresh_lower_1
        values: {match_thresh: 0.70}
      - id: match_thresh_higher_1
        values: {match_thresh: 0.90}

  - id: track_buffer
    label: Lost-track lifetime (frames retained before removal)
    kind: single
    parameters: [track_buffer]
    canonical_values:
      track_buffer: 30
    note: >-
      track_buffer, scaled by frame_rate/30, sets max_time_lost: how long a
      lost tracklet is retained for possible re-association before removal.
      Shorter forgets faster; longer persists a stale identity longer.
      Symmetric single step of 15 frames (0.5 s at 30 fps).
    perturbations:
      - id: track_buffer_lower_1
        values: {track_buffer: 15}
      - id: track_buffer_higher_1
        values: {track_buffer: 45}

baseline:
  id: canonical_baseline
  description: >-
    The materialized canonical_baseline configuration is byte-identical to the
    live canonical ByteTrack YAML and is run through the identical harness as
    every candidate. It is not compared against any previously published
    report generated by a different pipeline.

repeatability:
  requirement: >-
    Before interpreting any candidate difference, run canonical_baseline twice
    on each of the four sequences through this same harness and compare the
    generated tracker semantic digest, bootstrap resolution, TIM generated
    semantic digest, physical-v2 duration buckets, and state occupancy. Exact
    equality is required for a PASS. A mismatch is a determinism defect and
    must be investigated before parameter differences are interpreted.
  repeats: 2

interactions:
  included_in_this_freeze: false
  policy: >-
    This manifest freezes a single-pass OFAT matrix only. A small second-pass
    combination extension may be added only if the OFAT evidence shows one or
    two clearly promising directions with no safety regression. Any such
    combinations must be declared and committed in a new manifest version
    before their outcomes are inspected.

metrics:
  severity_ordering: correct_target > lost_or_hover > wrong_target
  interpretation_rule: >-
    A candidate is not an improvement merely because it publishes a target
    longer, reduces lost time, or holds a tracker ID longer. A configuration
    that converts lost/suppressed time into wrong-target authority is a safety
    regression. Report safety, correctness/availability, and behaviour
    separately; never collapse them into one scalar.
  tim_mars_physical_v2:
    - correct_target_output_duration_s / fraction
    - wrong_person_output_duration_s / fraction
    - lost_or_suppressed_duration_s / fraction
    - target_absent_with_output_duration_s
    - localisation iou_duration_weighted_mean
  raw_bytetrack_diagnostic:
    - target_matched_track_ids
    - target_id_switch_count
    - target_track_fragment_count
    - target_visible_coverage_fraction
    - false_continuation_during_absence_s
    - bootstrap_outcome / bootstrap_iou
  tim_state:
    - state_occupancy_fraction (only schema states)
    - transition_count / transitions_into_lost / transitions_into_reacquired
    - target_authority_change_count

expected_counts:
  dimensions: 3
  perturbations_per_dimension: 2
  candidate_configurations: 6
  canonical_baseline_count: 1
  unique_configurations: 7
  development_sequences: 4
  first_pass_cells: 28
  repeatability_cells: 8
  accounting: 7 configurations x 4 development sequences = 28 first-pass cells; canonical_baseline x 4 sequences x 2 repeats = 8 repeatability cells.

canonical_change_policy: >-
  This experiment produces a recommendation only. Regardless of outcome, no
  change is made to ros2_ws/src/thesis_bringup/config/tracker_bytetrack.yaml,
  to the Issue #27 frozen configuration, or to TIM-MARS. Any proposal to
  change the canonical tracker configuration is a separate, explicitly
  reviewed step.
