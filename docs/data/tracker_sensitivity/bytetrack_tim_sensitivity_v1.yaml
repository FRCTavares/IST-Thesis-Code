  sha256: e0e5c7c80a2f2b74cb6640e2ea90d9651c33f193c34365dc0d5a7ac9badaa906
  canonical_values:
    tracker_type: bytetrack
    min_score: 0.2
    track_thresh: 0.5
    match_thresh: 0.8
    track_buffer: 30
    frame_rate: 30
    low_thresh: 0.1
    new_track_thresh: 0.6
    second_match_thresh: 0.5
    unconfirmed_match_thresh: 0.7
    fuse_scores: true
    mot20: false
  verification: >-
    The runner re-verifies this sha256 against the live file at every
