schema_version: 1
manifest_id: bytetrack_tim_sensitivity_v1
issue: 58

title: ByteTrack configuration sensitivity for downstream TIM-MARS

purpose: >-
  Determine experimentally whether one-factor-at-a-time perturbations of the
  canonical ByteTrack association/lifetime configuration change the
  controller-facing TIM-MARS result on the already-recorded development
  sequences. This is an offline development sensitivity study, not a retuning
  exercise. The canonical ByteTrack configuration remains canonical; no
  configuration in this matrix is promoted or selected as a replacement, and
  the canonical YAML is never modified on disk. The downstream question is
  the important one: raw tracker improvement alone is not sufficient evidence
  to change the canonical tracker.

research_question: >-
  Does changing ByteTrack's activation, association, or lost-track lifetime
  configuration improve the final TIM-MARS controller-facing target result
  compared with the current canonical ByteTrack settings, on the development
  sequences, without introducing wrong-target authority?

protocol_freeze:
  date: "2026-09-07"
  branch: experiment-bytetrack-tim-config-20260907
  baseline_commit_placeholder: recorded_by_runner_at_execution
  outcome_inspected_before_freeze: false
  statement: >-
    No physical-v2 outcome (correct/wrong/lost duration, localisation, state
    occupancy, or any other evaluator output) has been generated or inspected
    for any non-canonical ByteTrack configuration in this matrix as of this
    freeze. Every perturbation value above and below canonical was chosen from
    the parameter's own physical meaning and a symmetric single-step
    neighbourhood, not from any observed result.

frozen_invariants:
  - The canonical ByteTrack YAML (ros2_ws/src/thesis_bringup/config/tracker_bytetrack.yaml) is never modified on disk.
  - TIM-MARS is identical across every cell; the canonical TIM-MARS YAML and MARS model are unchanged.
  - The detector is not re-run; every cell for a sequence consumes the identical frozen recorded detections and images.
  - Physical development-sequence selection is unchanged; only tim_mars_split_v3 development sequences are used.
  - Physical-v2 references and the physical_target_bbox_evaluation_v2 semantics are unchanged.
  - new_track_thresh is pinned at its canonical value 0.6 for every cell, including the track_thresh perturbations, so the track_thresh experiment does not silently change track birth.
  - Only the parameters named in a dimension change relative to canonical; every other ByteTrack field is byte-identical to canonical.
  - No interaction (multi-dimension) configuration is included in this first frozen pass.
  - Reserved held-out sequences (heldout_h01_exit_reentry, heldout_h02_crossing, heldout_h03_occlusion_distractor) may never enter this matrix.

