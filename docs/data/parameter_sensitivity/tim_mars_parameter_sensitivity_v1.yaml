schema_version: 1
manifest_id: tim_mars_parameter_sensitivity_v1
issue: 31

title: TIM-MARS parameter-sensitivity OFAT sweep

purpose: >-
  Test whether the safety/correctness conclusions of the canonical TIM-MARS
  configuration are robust to reasonable one-factor-at-a-time perturbations
  of its seven main decision parameters (as one conceptual dimension each),
  and characterise the safety-availability trade-offs that emerge as each
  dimension becomes less or more conservative. This is a robustness study,
  not a retuning exercise: no configuration in this matrix is selected as a
  replacement for the canonical configuration, which remains canonical
  throughout Issue #31.

research_question: >-
  Are the safety/correctness conclusions of the canonical TIM-MARS
  configuration robust to reasonable perturbations of its main decision
  parameters, and what safety-availability trade-offs arise as those
  parameters become less or more conservative?

protocol_freeze:
  date: "2026-08-07"
  branch: issue-31-parameter-sensitivity
  baseline_commit: c2bf9ef56f164f83a9e47446478f0284c5eb7362
  issue_30_merge_pr: 71
  outcome_inspected_before_freeze: false
  statement: >-
    No sensitivity outcome (correct/wrong/lost duration, recovery, or any
    other evaluator output) has been generated or inspected for any
    non-canonical configuration in this matrix as of this freeze. Every
    perturbation value above and below canonical was chosen from the
    parameter's own physical meaning and the frozen +/-1 / +/-2 step
    pattern, not from any observed result.

frozen_invariants:
  - Detector (Hailo YOLOv6n/YOLOv8s) is unchanged.
  - ByteTrack tracker is unchanged.
  - Physical development-sequence selection is unchanged.
  - The canonical TIM-MARS YAML is never modified on disk.
  - Physical-target identity semantics (selected_target_id per sequence) are
    unchanged from Issue #30/#26 evidence.
  - No interaction (multi-dimension) configuration is included in this
    frozen first pass.

