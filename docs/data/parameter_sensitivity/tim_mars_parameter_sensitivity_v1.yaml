raw_stream_invariance:
  statement: >-
    The raw/ByteTrack reference stream for a given development sequence is a
    property of the source bag and detector/tracker candidates only; it does
    not depend on any TIM-MARS parameter under sweep. The runner must
    generate it once per sequence and then verify byte/metric equality on
    every subsequent configuration for that sequence, rather than treating
    each config's regenerated raw stream as new independent evidence. A
    mismatch is a tooling or non-determinism bug and must fail the run, not
    be silently averaged away.

fixed_parameters:
  - name: appearance_min_similarity
    canonical_value: 0.35
    rationale: >-
      Distinct base appearance-scoring gate, not the Issue #31
      "appearance minimum" sensitivity dimension. Issue #31 pairs an
      appearance minimum with a separation-margin concept; only the
      conservative-publication pair
      (appearance_conservative_min_similarity +
      appearance_conservative_margin) implements that paired decision.
      Kept fixed at its canonical value throughout Issue #31.
  - name: hard_negative_min_candidate_similarity
    canonical_value: 0.70
    rationale: >-
      Controls hard-negative gallery admission (which candidates are
      remembered as distractors), a different mechanism from the
      rejection-time threshold/margin pair
      (hard_negative_reject_similarity + hard_negative_reject_margin) that
      Issue #31 sweeps. Kept fixed at its canonical value throughout
      Issue #31.
  - name: rank_aware_confirm_frames
    canonical_value: 1
  - name: hard_negative_confirm_observations
    canonical_value: 2
  - name: appearance_trusted_lock_frames_before_update
    canonical_value: 2
  - name: max_uncertain_frames
    canonical_value: 6
  - name: confirmation_time_fixed_mechanisms_note
    note: >-
      rank_aware_confirm_frames, hard_negative_confirm_observations,
      appearance_trusted_lock_frames_before_update, and max_uncertain_frames
      are distinct confirmation/persistence mechanisms from
      min_confirm_frames_after_reacquire (the Issue #31 "confirmation time"
      dimension) and must not be silently bundled into it. All four are kept
      fixed at their canonical values throughout Issue #31.

dimensions:
  - id: acceptance_pair
    label: Acceptance threshold (state-dependent pair)
    kind: joint_pair
    parameters: [accept_score_locked, accept_score_lost]
    canonical_values:
      accept_score_locked: 0.52
      accept_score_lost: 0.60
    invariant: accept_score_lost - accept_score_locked == 0.08
    invariant_label: canonical LOST-LOCKED gap
    note: >-
      Swept jointly as one conceptual dimension, preserving the canonical
      0.08 gap. LOCKED is never swept independently of LOST.
    perturbations:
      - id: acceptance_pair_lower_2
        values: {accept_score_locked: 0.42, accept_score_lost: 0.50}
      - id: acceptance_pair_lower_1
        values: {accept_score_locked: 0.47, accept_score_lost: 0.55}
      - id: acceptance_pair_higher_1
        values: {accept_score_locked: 0.57, accept_score_lost: 0.65}
      - id: acceptance_pair_higher_2
        values: {accept_score_locked: 0.62, accept_score_lost: 0.70}

  - id: ambiguity_margin
    label: Ambiguity margin
    kind: single
    parameters: [ambiguity_margin]
    canonical_values:
      ambiguity_margin: 0.07
    note: >-
      Frozen pre-outcome points give a clean local +/-0.02 / +/-0.04
      neighbourhood rather than asymmetric extremes chosen after inspecting
      outcomes.
    perturbations:
      - id: ambiguity_margin_lower_2
        values: {ambiguity_margin: 0.03}
      - id: ambiguity_margin_lower_1
        values: {ambiguity_margin: 0.05}
      - id: ambiguity_margin_higher_1
        values: {ambiguity_margin: 0.09}
      - id: ambiguity_margin_higher_2
        values: {ambiguity_margin: 0.11}

  - id: appearance_conservative_min_similarity
    label: Conservative appearance minimum
    kind: single
    parameters: [appearance_conservative_min_similarity]
    canonical_values:
      appearance_conservative_min_similarity: 0.65
    note: >-
      This is the Issue #31 "appearance minimum" dimension (paired with the
      separation-margin dimension below). The simpler
      appearance_min_similarity base gate (0.35) is kept fixed; see
      fixed_parameters.
    perturbations:
      - id: appearance_conservative_min_similarity_lower_2
        values: {appearance_conservative_min_similarity: 0.55}
      - id: appearance_conservative_min_similarity_lower_1
        values: {appearance_conservative_min_similarity: 0.60}
      - id: appearance_conservative_min_similarity_higher_1
        values: {appearance_conservative_min_similarity: 0.70}
      - id: appearance_conservative_min_similarity_higher_2
        values: {appearance_conservative_min_similarity: 0.75}

  - id: appearance_conservative_margin
    label: Conservative appearance separation margin
    kind: single
    parameters: [appearance_conservative_margin]
    canonical_values:
      appearance_conservative_margin: 0.05
    perturbations:
      - id: appearance_conservative_margin_lower_2
        values: {appearance_conservative_margin: 0.01}
      - id: appearance_conservative_margin_lower_1
        values: {appearance_conservative_margin: 0.03}
      - id: appearance_conservative_margin_higher_1
        values: {appearance_conservative_margin: 0.07}
      - id: appearance_conservative_margin_higher_2
        values: {appearance_conservative_margin: 0.09}

  - id: hard_negative_reject_similarity
    label: Hard-negative rejection threshold
    kind: single
    parameters: [hard_negative_reject_similarity]
    canonical_values:
      hard_negative_reject_similarity: 0.80
    note: >-
      This is the live rejection-time threshold. hard_negative_min_candidate_similarity
      (gallery admission) is a different mechanism and is kept fixed; see
      fixed_parameters.
    perturbations:
      - id: hard_negative_reject_similarity_lower_2
        values: {hard_negative_reject_similarity: 0.70}
      - id: hard_negative_reject_similarity_lower_1
        values: {hard_negative_reject_similarity: 0.75}
      - id: hard_negative_reject_similarity_higher_1
        values: {hard_negative_reject_similarity: 0.85}
      - id: hard_negative_reject_similarity_higher_2
        values: {hard_negative_reject_similarity: 0.90}

  - id: hard_negative_reject_margin
    label: Hard-negative rejection margin
    kind: single
    parameters: [hard_negative_reject_margin]
    canonical_values:
      hard_negative_reject_margin: 0.03
    perturbations:
      - id: hard_negative_reject_margin_lower_2
        values: {hard_negative_reject_margin: 0.00}
      - id: hard_negative_reject_margin_lower_1
        values: {hard_negative_reject_margin: 0.015}
      - id: hard_negative_reject_margin_higher_1
        values: {hard_negative_reject_margin: 0.045}
      - id: hard_negative_reject_margin_higher_2
        values: {hard_negative_reject_margin: 0.06}

  - id: confirmation_time
    label: Confirmation time after reacquisition
    kind: single
    parameters: [min_confirm_frames_after_reacquire]
    canonical_values:
      min_confirm_frames_after_reacquire: 1
    effective_frame_offset: 1
    effective_label: >-
      The implementation requires one more frame than the configured value,
      so the effective persistence requirement is configured_value + 1.
    effective_map:
      0: 1
      1: 2
      2: 3
      3: 4
      4: 5
    note: >-
      Only four non-canonical perturbations exist because the configured
      value cannot go below 0 (effective 1 frame); there is one "lower"
      point and three "higher" points, not a symmetric +/-2 pattern.
    perturbations:
      - id: confirmation_time_lower_1
        values: {min_confirm_frames_after_reacquire: 0}
        effective_frames: 1
      - id: confirmation_time_higher_1
        values: {min_confirm_frames_after_reacquire: 2}
        effective_frames: 3
      - id: confirmation_time_higher_2
        values: {min_confirm_frames_after_reacquire: 3}
        effective_frames: 4
      - id: confirmation_time_higher_3
        values: {min_confirm_frames_after_reacquire: 4}
        effective_frames: 5

interactions:
  included_in_this_freeze: false
  policy: >-
    This manifest freezes a single-pass OFAT (one-factor-at-a-time) matrix
    only. Interaction (multi-dimension) configurations may only be added
    afterward, and only if the OFAT evidence itself reveals an intrinsically
    coupled mechanism for which single-parameter interpretation would be
    scientifically invalid. Any such interaction configurations must be
    declared, named, and added to a new manifest version *before* their
    results are inspected, exactly as this OFAT matrix was declared before
    its own results exist.

metrics:
  note: >-
    The final analysis (reusing tools/analysis/evaluate_tim_event_recovery.py
    where compatible) must report safety, correctness/availability, and
    behaviour metrics separately and must not collapse them into one scalar
    score. Thesis severity ordering: wrong target > lost/suppressed.
  safety:
    - wrong_target_duration_s / wrong_target_fraction
    - wrong_target_episode_count
    - longest_wrong_target_burst_s
    - stale_id_or_wrong_person_behaviour_where_defined
  correctness_availability:
    - correct_target_duration_s / correct_target_fraction
    - lost_or_suppressed_duration_s / lost_or_suppressed_fraction
    - state_occupancy
    - recovery_success
    - recovery_latency_s
    - same_person_recovery_where_available
  behaviour:
    - ambiguity_diagnostics
    - confirmation_diagnostics
    - suppression_diagnostics
    - memory_and_recovery_lifecycle_diagnostics

expected_counts:
  dimensions: 7
  perturbations_per_dimension: 4
  unique_configurations: 29
  canonical_baseline_count: 1
  development_sequences: 4
  total_replay_runs: 116
  accounting: 29 configurations x 4 development sequences = 116 deterministic TIM replay experiments.
