raw_target_mode_rationale: >-
  Follows the Issue #28 development/ablation precedent
  (docs/data/ablations/tim_mars_component_ablation_v1.yaml,
  tools/experiments/run_tim_component_ablation.py) and preserves the real
  tracker-selected source `/target` stream as the raw baseline. Issue #30's
  oracle `selected_id` mode is not used for the primary Issue #31 sensitivity
  study: it changes the candidate-stream question being asked and would
  confound parameter-sensitivity interpretation. If oracle-mode sensitivity
  is ever studied, it must be a separately labelled diagnostic experiment,
  not mixed into this primary result.

