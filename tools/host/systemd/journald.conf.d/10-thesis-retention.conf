[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=10G
SystemMaxFileSize=64M
RuntimeMaxUse=128M
RuntimeKeepFree=1G
MaxRetentionSec=30day
