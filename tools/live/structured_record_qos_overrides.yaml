# Recorder subscription buffering for the nine structured runtime streams.
# Structured runtime publishers offer RELIABLE delivery; recorder depth
# absorbs brief scheduling stalls without changing algorithmic behavior.
/camera/fps:
  history: keep_last
  depth: 256
  reliability: reliable
  durability: volatile
